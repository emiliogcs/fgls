      - fgls-methods
      - plot.fgls
      - compare_fgls
      - fgls-broom
  - title: Benchmarks
    desc: OLS with HAC/HC standard errors, Cochrane-Orcutt, Durbin, infeasible and hybrid GLS.
    contents:
      - ols_robust
  - title: Diagnostics
    contents:
