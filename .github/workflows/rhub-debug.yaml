# Temporary: fetch a win-builder check log and report it as an annotation.
on:
  push:
    branches: [ci/rhub-debug]

name: rhub-debug

permissions: read-all

jobs:
  winbuilder-log:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the win-builder log
        shell: bash
        run: |
          base=https://win-builder.r-project.org/3DYzAVR8YEYu
          curl -sS --fail -o check.log "$base/00check.log" || echo "fetch failed" > check.log
          curl -sS "$base/" | sed -e 's/<[^>]*>/ /g' | tr -s ' ' | grep -v "^ *$" | head -40 > listing.txt || true
          for f in check.log listing.txt; do
            msg=$(sed -e 's/%/%25/g' -e 's/\r//g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=$f::$msg"
          done
