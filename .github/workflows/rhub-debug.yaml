# Temporary: find the test that hangs in R-hub's nosuggests container.
on:
  push:
    branches: [ci/rhub-debug]

name: rhub-debug

permissions: read-all

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
    steps:
    - uses: r-hub/actions/setup@v1
      with:
        config: nosuggests
      id: rhub-setup

  baseR:
    needs: setup
    runs-on: ubuntu-latest
    name: base-R ${{ matrix.limit }} ${{ matrix.rep }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
        limit: [omp-limit-2, no-omp-limit]
        rep: [1, 2, 3]
    container:
      image: ${{ matrix.config.container }}
    steps:
      - name: Base R LAPACK loop (no packages)
        shell: bash
        run: |
          if [ "${{ matrix.limit }}" = "no-omp-limit" ]; then unset OMP_THREAD_LIMIT; fi
          echo "OMP_THREAD_LIMIT=${OMP_THREAD_LIMIT:-unset}" > report.txt
          cat > loop.R <<'EOF2'
          set.seed(1)
          A <- crossprod(matrix(rnorm(300 * 300), 300)) + diag(300)
          X <- matrix(rnorm(200 * 63), 200)
          for (i in 1:100) {
            L <- chol(A); S <- svd(X); E <- eigen(crossprod(X), symmetric = TRUE); B <- solve(A)
            if (i %% 10 == 0) cat(format(Sys.time(), "%H:%M:%OS2"), "iteration", i, "\n")
          }
          cat("done\n")
          EOF2
          start=$(date +%s)
          if timeout 240 Rscript --vanilla loop.R > loop.out 2>&1; then st=finished; else st="HUNG/failed (exit $?)"; fi
          echo "status=$st after $(( $(date +%s) - start ))s" >> report.txt
          tail -3 loop.out >> report.txt
          msg=$(sed -e 's/%/%25/g' report.txt | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=${{ matrix.limit }}-${{ matrix.rep }}::$msg"

