# Temporary: find the test that hangs in R-hub's nosuggests container.
on:
  push:
    branches: [ci/rhub-debug]

name: rhub-debug

permissions: read-all

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
    steps:
    - uses: r-hub/actions/setup@v1
      with:
        config: nosuggests
      id: rhub-setup

  hang:
    needs: setup
    runs-on: ubuntu-latest
    name: ${{ matrix.variant }}-${{ matrix.rep }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
        variant: [as-is, no-fork-test]
        rep: [1, 2, 3]
    container:
      image: ${{ matrix.config.container }}
    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/setup-deps@v1
        with:
          job-config: ${{ matrix.config.job-config }}
      - name: Check with a watchdog
        shell: bash
        run: |
          if [ "${{ matrix.variant }}" = "no-fork-test" ]; then
            sed -i '/does not depend on cores/,/^})/d' tests/testthat/test-combined.R
            grep -c "cores = 2L" tests/testthat/test-combined.R || true
          fi
          R CMD build --no-manual . > build.out 2>&1
          timeout 660 R CMD check --no-manual --extra-arch fgls_*.tar.gz > check.out 2>&1 &
          pid=$!
          status="finished"
          for i in $(seq 1 48); do
            sleep 10
            kill -0 $pid 2>/dev/null || break
            if [ $i -eq 48 ]; then status="HUNG"; fi
          done
          {
            echo "variant=${{ matrix.variant }} rep=${{ matrix.rep }} status=$status"
            if [ "$status" = "HUNG" ]; then
              echo "--- processes"
              ps -eo pid,ppid,stat,etime,nlwp,wchan:24,args --forest 2>/dev/null | grep -v "ps -eo" | cut -c1-220 || ls /proc | head
            fi
            echo "--- tail of 00check.log"
            tail -8 fgls.Rcheck/00check.log 2>/dev/null
          } > report.txt
          wait $pid || true
          msg=$(sed -e 's/%/%25/g' report.txt | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=${{ matrix.variant }}-${{ matrix.rep }}::$msg"
