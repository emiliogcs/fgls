# Uploads the package to win-builder (https://win-builder.r-project.org/), which
# checks it on Windows and e-mails the results to the maintainer in DESCRIPTION.
# This is what devtools::check_win_devel() and friends do, run from a GitHub
# runner. Start it from the Actions tab or with `gh workflow run win-builder.yaml`.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Comma-separated win-builder queues (R-devel, R-release, R-oldrelease)"
        type: string
        default: "R-devel,R-release,R-oldrelease"

name: win-builder

permissions: read-all

jobs:
  win-builder:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Build the source package
        run: R CMD build .

      - name: Upload to win-builder
        env:
          VERSIONS: ${{ inputs.versions }}
        run: |
          tarball=$(ls fgls_*.tar.gz)
          for v in ${VERSIONS//,/ }; do
            echo "Uploading $tarball to the $v queue"
            curl --fail --retry 3 --retry-delay 10 -T "$tarball" "ftp://win-builder.r-project.org/$v/"
          done
