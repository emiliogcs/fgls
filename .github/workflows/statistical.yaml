# Paper-replication (Monte Carlo) acceptance tests: slow, not on CRAN.
#
# Runs weekly, to catch changes in dependencies, R or the runner's BLAS that
# move the results (the code itself only changes on push), and on demand
# (workflow_dispatch) before releases and after changes to the estimators.
on:
  schedule:
    - cron: "41 2 * * 0" # weekly, Sunday 02:41 UTC
  workflow_dispatch:

name: statistical

permissions: read-all

jobs:
  statistical:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FGLS_SLOW_TESTS: "true"
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v5
      # One forked worker per core of the runner (2 on private repositories,
      # 4 on public ones); results do not depend on it.
      - name: Number of cores
        run: echo "FGLS_SLOW_CORES=$(nproc)" >> "$GITHUB_ENV"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, local::.
          needs: check
      - name: Statistical acceptance tests
        run: testthat::test_local(filter = "statistical", stop_on_failure = TRUE)
        shell: Rscript {0}
